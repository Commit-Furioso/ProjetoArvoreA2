<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fórmulas - Explosão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Gestão de Produção (Árvore Genérica)</h1>
        
        <div class="acoes">
            <button onclick="carregarFormula()">Carregar Explosão da Caneta</button>
        </div>

        <!-- Aqui a árvore vai ser desenhada pelo JavaScript -->
        <div class="area-arvore">
            <h3>Estrutura do Produto:</h3>
            <div id="arvore-visual" class="tree-container">
                <em>Clique no botão acima para carregar a fórmula...</em>
            </div>
        </div>

        <div class="calculadora">
            <h3>Simulação de Lote</h3>
            <label for="qtd-produzir">Quantidade de produtos a fabricar:</label>
            <input type="number" id="qtd-produzir" value="1" min="1" onchange="calcularProducao()">
            <button class="btn-secundario" onclick="calcularProducao()">Recalcular</button>
            
            <h2 id="resultado-total">Valor Total: R$ 0,00</h2>
        </div>
<div class="calculadora">
            <h3>✏️ Atualizar Preço (CRUD)</h3>
            
            <div class="form-linha">
                <div class="input-grupo">
                    <label for="select-item">Componente:</label>
                    <select id="select-item" class="select-estilizado">
                        <option value="">Carregando...</option>
                    </select>
                </div>
                
                <div class="input-grupo">
                    <label for="novo-preco">Novo Preço (R$):</label>
                    <input type="number" id="novo-preco" class="input-estilizado" step="0.01" min="0" placeholder="Ex: 1.50">
                </div>
            </div>
            
            <button onclick="atualizarPrecoComponente()" style="margin-top: 15px;">Salvar Novo Preço</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
<!-- Elemento da Notificação Toast -->
    <div id="toast-notificacao" class="toast">
        Mensagem de teste
    </div>
</html>
