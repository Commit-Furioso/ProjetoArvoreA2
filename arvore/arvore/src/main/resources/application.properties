spring.application.name=arvore
# Configurações do H2 Database (Banco em memória)
spring.datasource.url=jdbc:h2:mem:arvoredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console web do banco de dados no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualizar a tabela automaticamente sempre que mudar o código
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true